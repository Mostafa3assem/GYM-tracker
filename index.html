<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تمريني - Gym Tracker</title>
    <meta name="theme-color" content="#0a0a0f">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="description" content="تطبيق لتتبع تمارينك الرياضية والأوزان في الجيم.">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-512.jpg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="app">
        <!-- Header -->
        <header class="app-header">
            <div class="header-right">
                <span class="logo-icon">💪</span>
                <h1 class="logo-text">تمريني</h1>
            </div>
            <div class="header-left">
                <div class="brand-badge">
                    <span class="brand-text">SEC ASSEM</span>
                </div>
                <div class="header-date" id="current-date"></div>
            </div>
        </header>

        <!-- === VIEW: Today === -->
        <section id="today-view" class="view active">
            <div class="summary-card">
                <div class="summary-item">
                    <span class="summary-value" id="summary-exercises">٠</span>
                    <span class="summary-label">تمرين</span>
                </div>
                <div class="summary-divider"></div>
                <div class="summary-item">
                    <span class="summary-value" id="summary-sets">٠</span>
                    <span class="summary-label">مجموعة</span>
                </div>
                <div class="summary-divider"></div>
                <div class="summary-item">
                    <span class="summary-value" id="summary-timer">٠٠:٠٠</span>
                    <span class="summary-label">الوقت</span>
                </div>
            </div>

            <div id="today-list" class="today-list"></div>

            <button class="fab" id="fab-btn" aria-label="إضافة تمرين">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="12" y1="5" x2="12" y2="19"></line>
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
            </button>
        </section>

        <!-- === VIEW: Library === -->
        <section id="library-view" class="view">
            <div class="search-box">
                <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <input type="text" id="search-input" placeholder="ابحث عن تمرين..." autocomplete="off">
            </div>

            <div class="category-pills" id="category-pills">
                <button class="pill active" data-category="all">الكل</button>
                <button class="pill" data-category="chest">صدر</button>
                <button class="pill" data-category="back">ظهر</button>
                <button class="pill" data-category="shoulders">أكتاف</button>
                <button class="pill" data-category="arms">ذراع</button>
                <button class="pill" data-category="legs">أرجل</button>
                <button class="pill" data-category="core">بطن</button>
                <button class="pill" data-category="cardio">كارديو</button>
            </div>

            <div id="exercise-grid" class="exercise-grid"></div>
        </section>

        <!-- === VIEW: History === -->
        <section id="history-view" class="view">
            <div id="history-list" class="history-list"></div>
        </section>

        <!-- Bottom Navigation -->
        <nav class="bottom-nav">
            <button class="nav-btn active" data-view="today-view">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M6.5 6.5h11M5 12h14M6.5 17.5h11"></path>
                    <circle cx="3" cy="6.5" r="1.5" fill="currentColor"></circle>
                    <circle cx="3" cy="12" r="1.5" fill="currentColor"></circle>
                    <circle cx="3" cy="17.5" r="1.5" fill="currentColor"></circle>
                </svg>
                <span>تمرين اليوم</span>
            </button>
            <button class="nav-btn" data-view="library-view">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="7" height="7" rx="1"></rect>
                    <rect x="14" y="3" width="7" height="7" rx="1"></rect>
                    <rect x="3" y="14" width="7" height="7" rx="1"></rect>
                    <rect x="14" y="14" width="7" height="7" rx="1"></rect>
                </svg>
                <span>التمارين</span>
            </button>
            <button class="nav-btn" data-view="history-view">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <polyline points="12 6 12 12 16 14"></polyline>
                </svg>
                <span>السجل</span>
            </button>
        </nav>

        <!-- === MODAL: Add/Edit Exercise === -->
        <div id="exercise-modal" class="modal">
            <div class="modal-backdrop" id="modal-backdrop"></div>
            <div class="modal-sheet">
                <div class="modal-handle"></div>
                <h2 class="modal-title" id="modal-title">اسم التمرين</h2>

                <div class="last-session-box" id="last-session-box">
                    <span id="last-session-text">أول مرة تلعب التمرين ده! 💪</span>
                </div>

                <!-- Weight -->
                <div class="input-row">
                    <label>الوزن (كجم)</label>
                    <div class="stepper">
                        <button type="button" class="stepper-btn minus" data-field="weight" data-delta="-2.5">−</button>
                        <span class="stepper-value" id="val-weight">٠</span>
                        <button type="button" class="stepper-btn plus" data-field="weight" data-delta="2.5">+</button>
                    </div>
                    <span class="weight-diff" id="weight-diff"></span>
                </div>

                <!-- Sets -->
                <div class="input-row">
                    <label>المجموعات</label>
                    <div class="stepper">
                        <button type="button" class="stepper-btn minus" data-field="sets" data-delta="-1">−</button>
                        <span class="stepper-value" id="val-sets">٣</span>
                        <button type="button" class="stepper-btn plus" data-field="sets" data-delta="1">+</button>
                    </div>
                </div>

                <!-- Reps -->
                <div class="input-row">
                    <label>التكرارات</label>
                    <div class="stepper">
                        <button type="button" class="stepper-btn minus" data-field="reps" data-delta="-1">−</button>
                        <span class="stepper-value" id="val-reps">١٠</span>
                        <button type="button" class="stepper-btn plus" data-field="reps" data-delta="1">+</button>
                    </div>
                </div>

                <!-- Notes -->
                <div class="notes-row">
                    <label for="notes-input">ملاحظات</label>
                    <textarea id="notes-input" rows="2" placeholder="مثال: فورم ممتاز، زودت الوزن..."></textarea>
                </div>

                <div class="modal-actions">
                    <button type="button" class="btn-cancel" id="btn-cancel">إلغاء</button>
                    <button type="button" class="btn-save" id="btn-save">حفظ التمرين</button>
                </div>
            </div>
        </div>

        <!-- Signature -->
        <div class="signature">
            <span class="sig-line"></span>
            <span class="sig-text">Built by <strong>SEC ASSEM</strong></span>
            <span class="sig-line"></span>
        </div>

        <!-- Toast -->
        <div id="toast" class="toast" aria-live="polite"></div>
    </div>

    <script src="app.js"></script>
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      }
    </script>
</body>
</html>
